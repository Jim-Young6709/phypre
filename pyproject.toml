[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phypre"
version = "0.1.0"
description = "Physics pretraining environments and data-generation utilities for Isaac Lab."
requires-python = ">=3.11"
dependencies = [
    "isaaclab[isaacsim,all]==2.3.2.post1",
    "numpy>=1.24",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
]

[project.optional-dependencies]
recording = [
    "h5py>=3.8",
    "opencv-python>=4.8",
]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Jim-Young6709/phypre"

[tool.setuptools.packages.find]
include = ["phy*"]
