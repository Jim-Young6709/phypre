# DEXTRAH LSTM networks with the pushing PPO settings.
wandb:
  project: phypre
  entity: team-jim
  name: franka_push_lstm_%Y-%m-%d_%H-%M-%S
params:
  seed: 42
  env:
    clip_actions: 1.0
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true
    mlp:
      units:
      - 512
      - 512
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 1024
      layers: 1
      before_mlp: true
      layer_norm: true
      concat_input: true
      concat_output: true
  load_checkpoint: false
  load_path: ''
  config:
    name: franka_push_lstm
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.0003
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 100000
    max_epochs: 100000
    save_best_after: 10
    save_frequency: 100
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size_per_env: 16
    minibatch_size: 1024
    mini_epochs: 4
    critic_coef: 2
    clip_value: true
    bounds_loss_coef: 0.0001
    use_experimental_cv: false
    central_value_config:
      minibatch_size_per_env: 16
      minibatch_size: 1024
      mini_epochs: 4
      learning_rate: 0.0003
      clip_value: true
      normalize_input: true
      truncate_grads: true
      network:
        name: actor_critic
        central_value: true
        mlp:
          units:
          - 1024
          - 512
          activation: elu
          d2rl: false
          initializer:
            name: default
          regularizer:
            name: None
        rnn:
          name: lstm
          units: 2048
          layers: 1
          before_mlp: false
          layer_norm: true
          concat_input: true
          concat_output: true
    player:
      deterministic: true
    seq_length: 16
    zero_rnn_on_done: true
